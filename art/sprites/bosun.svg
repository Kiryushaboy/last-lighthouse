<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Боцман сверху, смотрит вправо: широкие плечи, полосатый свитер, чёрная шапка, рыжая борода, тяжёлая гарпунная пушка. -->
  <defs>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2524a"/>
      <stop offset="1" stop-color="#8f2626"/>
    </linearGradient>
    <clipPath id="body"><ellipse cx="54" cy="64" rx="33" ry="44"/></clipPath>
  </defs>
  <!-- тяжёлая пушка: толстый ствол с обручами -->
  <rect x="62" y="69" width="52" height="16" rx="6" fill="#2b3340"/>
  <rect x="78" y="68" width="6" height="18" rx="2" fill="#c98b3a"/>
  <rect x="96" y="68" width="6" height="18" rx="2" fill="#c98b3a"/>
  <path d="M112 70 L124 77 L112 84 Z" fill="#ff7a5a"/>
  <!-- свитер в полоску -->
  <ellipse cx="54" cy="64" rx="33" ry="44" fill="url(#sweater)"/>
  <g clip-path="url(#body)" opacity="0.55">
    <rect x="10" y="30" width="100" height="7" fill="#f5efe6"/>
    <rect x="10" y="48" width="100" height="7" fill="#f5efe6"/>
    <rect x="10" y="73" width="100" height="7" fill="#f5efe6"/>
    <rect x="10" y="91" width="100" height="7" fill="#f5efe6"/>
  </g>
  <ellipse cx="54" cy="64" rx="33" ry="44" fill="none" stroke="#ff9a7a" stroke-width="3" opacity="0.8"/>
  <!-- кулаки на пушке -->
  <circle cx="74" cy="88" r="10" fill="#e8b48a" stroke="#8f2626" stroke-width="3"/>
  <circle cx="74" cy="52" r="10" fill="#e8b48a" stroke="#8f2626" stroke-width="3"/>
  <!-- рыжая борода торчит вперёд -->
  <path d="M66 50 Q86 64 66 78 Q72 64 66 50 Z" fill="#d9692a"/>
  <!-- чёрная вязаная шапка с отворотом -->
  <circle cx="54" cy="64" r="21" fill="#1d2230"/>
  <circle cx="54" cy="64" r="21" fill="none" stroke="#3a4256" stroke-width="5"/>
  <circle cx="54" cy="64" r="6" fill="#3a4256"/>
  <path d="M42 54 a15 15 0 0 1 14 -7" stroke="#8890a8" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
