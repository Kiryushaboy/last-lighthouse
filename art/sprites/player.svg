<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Смотритель маяка сверху, смотрит вправо: плащ, зюйдвестка, гарпунное ружьё и фонарь. -->
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ffb030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6fa3"/>
      <stop offset="1" stop-color="#173c63"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f0a81c"/>
    </linearGradient>
  </defs>
  <!-- ружьё -->
  <rect x="66" y="72" width="44" height="9" rx="4" fill="#3b4656"/>
  <rect x="104" y="73" width="14" height="7" rx="3" fill="#ffd25a"/>
  <rect x="70" y="70" width="14" height="13" rx="4" fill="#6b4a2f"/>
  <!-- плащ (плечи) -->
  <ellipse cx="56" cy="64" rx="28" ry="38" fill="url(#coat)"/>
  <ellipse cx="56" cy="64" rx="28" ry="38" fill="none" stroke="#7fe3ff" stroke-width="3" opacity="0.8"/>
  <!-- руки -->
  <ellipse cx="74" cy="77" rx="10" ry="8" fill="#2d6fa3"/>
  <ellipse cx="72" cy="40" rx="9" ry="8" fill="#2d6fa3"/>
  <!-- фонарь в другой руке -->
  <circle cx="84" cy="34" r="20" fill="url(#lamp)"/>
  <rect x="78" y="28" width="12" height="13" rx="3" fill="#ffe9a0" stroke="#7a5a2a" stroke-width="2"/>
  <!-- зюйдвестка: широкие поля и тулья -->
  <ellipse cx="58" cy="64" rx="25" ry="24" fill="#d68a12"/>
  <circle cx="56" cy="64" r="16" fill="url(#hat)"/>
  <path d="M46 56 a14 14 0 0 1 14 -6" stroke="#fff6c8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- козырёк вперёд — видно, куда смотрит -->
  <path d="M74 54 Q86 64 74 74 Z" fill="#f0a81c"/>
</svg>
