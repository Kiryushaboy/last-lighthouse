<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Механик сверху, смотрит вправо: комбинезон, катушка-аккумулятор за спиной, очки на лбу, разрядник в руках. -->
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f7f99"/>
      <stop offset="1" stop-color="#2e4256"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- катушка-аккумулятор на спине -->
  <rect x="14" y="44" width="20" height="40" rx="6" fill="#26313f" stroke="#8fe3ff" stroke-width="3"/>
  <rect x="18" y="50" width="12" height="4" fill="#8fe3ff"/>
  <rect x="18" y="60" width="12" height="4" fill="#8fe3ff"/>
  <rect x="18" y="70" width="12" height="4" fill="#8fe3ff"/>
  <!-- разрядник: медные кольца и искра на конце -->
  <rect x="64" y="71" width="40" height="8" rx="3" fill="#3b4656"/>
  <circle cx="76" cy="75" r="7" fill="none" stroke="#e09a4a" stroke-width="3"/>
  <circle cx="90" cy="75" r="7" fill="none" stroke="#e09a4a" stroke-width="3"/>
  <circle cx="110" cy="75" r="13" fill="url(#spark)"/>
  <!-- кабель от аккумулятора -->
  <path d="M30 80 Q50 100 66 80" stroke="#1b2129" stroke-width="4" fill="none"/>
  <!-- комбинезон -->
  <ellipse cx="54" cy="64" rx="27" ry="36" fill="url(#suit)"/>
  <ellipse cx="54" cy="64" rx="27" ry="36" fill="none" stroke="#8fe3ff" stroke-width="3" opacity="0.85"/>
  <!-- руки в перчатках -->
  <circle cx="72" cy="79" r="8" fill="#e0a83a"/>
  <circle cx="70" cy="45" r="8" fill="#e0a83a"/>
  <!-- гаечный ключ в другой руке -->
  <rect x="72" y="38" width="22" height="5" rx="2" fill="#b8c2cc" transform="rotate(-20 72 40)"/>
  <!-- голова: короткие тёмные волосы и очки на лбу -->
  <circle cx="54" cy="64" r="15" fill="#3a2a22"/>
  <rect x="58" y="51" width="7" height="26" rx="3" fill="#26313f"/>
  <circle cx="64" cy="57" r="6" fill="#8fe3ff" stroke="#26313f" stroke-width="3"/>
  <circle cx="64" cy="71" r="6" fill="#8fe3ff" stroke="#26313f" stroke-width="3"/>
  <circle cx="62" cy="55" r="2" fill="#ffffff"/>
  <circle cx="62" cy="69" r="2" fill="#ffffff"/>
</svg>
