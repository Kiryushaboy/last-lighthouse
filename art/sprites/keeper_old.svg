<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Старый смотритель, портрет для обучения: зюйдвестка, седая борода, трубка. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1f5a86"/>
      <stop offset="0.6" stop-color="#0d2a47"/>
      <stop offset="1" stop-color="#06162b"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe678"/>
      <stop offset="1" stop-color="#f0a01c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c79c"/>
      <stop offset="1" stop-color="#d99a6c"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d6e8"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6fa3"/>
      <stop offset="1" stop-color="#143457"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.4" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff6a1c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><circle cx="80" cy="80" r="74"/></clipPath>
  </defs>
  <circle cx="80" cy="80" r="74" fill="url(#bg)"/>
  <g clip-path="url(#round)">
    <!-- далёкий луч за спиной -->
    <path d="M80 70 L-20 20 L-20 62 Z" fill="#ffe9a0" opacity="0.13"/>
    <path d="M80 70 L180 10 L180 50 Z" fill="#ffe9a0" opacity="0.10"/>
    <!-- плечи -->
    <path d="M14 170 Q18 116 54 108 L106 108 Q142 116 146 170 Z" fill="url(#coat)"/>
    <path d="M54 108 Q80 132 106 108" fill="none" stroke="#7fe3ff" stroke-width="3" opacity="0.7"/>
    <!-- лицо -->
    <ellipse cx="80" cy="78" rx="30" ry="32" fill="url(#skin)"/>
    <!-- борода -->
    <path d="M48 78 Q46 122 80 136 Q114 122 112 78 Q104 96 80 96 Q56 96 48 78 Z" fill="url(#beard)"/>
    <path d="M62 112 Q80 124 98 112" fill="none" stroke="#9fc2d8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- усы -->
    <path d="M80 90 Q68 86 58 96 Q70 102 80 96 Q90 102 102 96 Q92 86 80 90 Z" fill="#ffffff"/>
    <!-- нос и щёки -->
    <ellipse cx="80" cy="82" rx="7" ry="8" fill="#e9a878"/>
    <circle cx="61" cy="84" r="6" fill="#ff8f7a" opacity="0.45"/>
    <circle cx="99" cy="84" r="6" fill="#ff8f7a" opacity="0.45"/>
    <!-- добрые глаза и брови -->
    <path d="M62 72 q6 -6 12 0" fill="none" stroke="#20324a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M86 72 q6 -6 12 0" fill="none" stroke="#20324a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58 62 q10 -7 18 -1" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M84 61 q8 -6 18 1" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- зюйдвестка -->
    <path d="M30 60 Q80 30 130 60 Q118 68 80 64 Q42 68 30 60 Z" fill="#d68a12"/>
    <path d="M44 56 Q46 14 80 14 Q114 14 116 56 Q80 44 44 56 Z" fill="url(#hat)"/>
    <path d="M56 30 Q64 20 78 19" fill="none" stroke="#fff6c8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- трубка -->
    <path d="M90 100 Q108 108 120 100" fill="none" stroke="#6b4a2f" stroke-width="5" stroke-linecap="round"/>
    <rect x="114" y="88" width="14" height="15" rx="4" fill="#7a5433"/>
    <circle cx="121" cy="87" r="10" fill="url(#ember)"/>
  </g>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#ffd25a" stroke-width="4"/>
  <circle cx="80" cy="80" r="78" fill="none" stroke="#ffd25a" stroke-width="1.5" opacity="0.4"/>
</svg>
